<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EESTfix | Gestionar reportes</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header class="navbar"><div class="container navbar-container"><a href="../index.html" class="logo">EEST<span>fix</span></a><nav class="nav-menu admin-nav"><a href="index.html">Panel</a><a href="reportes.html">Reportes</a><a href="usuarios.html">Usuarios</a><button class="btn btn-secondary" data-logout>Cerrar sesión</button></nav></div></header><main class="admin-shell"><h1>Gestión de reportes</h1><div id="adminReports">Cargando…</div></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{try{await API.init();if(!API.user||API.user.rol!=='administrador'){location.href='../login.html';return;}const d=await API.request('../backend/reportes/listar.php');const states=['Pendiente','En revisión','En reparación','Solucionado','Rechazado'];document.querySelector('#adminReports').innerHTML=d.reportes.map(r=>`<article class="report-card"><div class="report-card-top"><b>${API.escape(r.codigo)} · ${API.escape(r.titulo)}</b><span>${API.escape(r.categoria)}</span></div><p>${API.escape(r.descripcion)}</p><p>Ubicación: ${API.escape(r.ubicacion)} · Reportó: ${API.escape(r.autor)} ${API.escape(r.apellido)}</p>${r.imagen?`<img class="report-photo" src="../${API.escape(r.imagen)}" alt="Foto del problema">`:''}<div class="admin-actions"><select data-state="${r.id}">${states.map(s=>`<option ${s===r.estado?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-primary" data-save="${r.id}">Guardar estado</button><button class="btn btn-secondary" data-delete="${r.id}">Eliminar</button></div></article>`).join('')||'No hay reportes.';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{await API.request('../backend/reportes/actualizar.php',{method:'POST',body:{id:b.dataset.save,estado:document.querySelector(`[data-state="${b.dataset.save}"]`).value}});alert('Estado actualizado.');}catch(e){alert(e.message);}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este reporte?'))return;try{await API.request('../backend/reportes/eliminar.php',{method:'POST',body:{id:b.dataset.delete}});location.reload();}catch(e){alert(e.message);}});}catch(e){document.querySelector('#adminReports').textContent=e.message;}});
</script></body></html>
