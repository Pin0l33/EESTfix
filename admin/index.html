<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EESTfix | Administración</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header class="navbar"><div class="container navbar-container"><a href="../index.html" class="logo">EEST<span>fix</span></a><nav class="nav-menu admin-nav"><a href="index.html">Panel</a><a href="reportes.html">Reportes</a><a href="usuarios.html">Usuarios</a><button type="button" class="btn btn-secondary" data-logout>Cerrar sesión</button></nav></div></header><main class="admin-shell"><h1>Panel de administración</h1><p>Resumen general de EESTfix.</p><div class="admin-grid" id="stats"><div class="stat-card">Cargando estadísticas…</div></div><div class="admin-panel"><h2>Últimos reportes</h2><div id="recentReports">Cargando…</div></div></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{try{await API.init();if(!API.user||API.user.rol!=='administrador'){location.href='../login.html';return;}const d=await API.request('../backend/admin/resumen.php');const s=d.stats;document.querySelector('#stats').innerHTML=[['Reportes',s.reportes],['Pendientes',s.pendientes],['En proceso',s.en_proceso],['Solucionados',s.solucionados],['Usuarios activos',s.usuarios]].map(([a,b])=>`<div class="stat-card">${a}<strong>${b}</strong></div>`).join('');const r=await API.request('../backend/reportes/listar.php');document.querySelector('#recentReports').innerHTML=r.reportes.slice(0,6).map(x=>`<p><b>${API.escape(x.codigo)}</b> — ${API.escape(x.titulo)} <span class="status-pill">${API.escape(x.estado)}</span></p>`).join('')||'No hay reportes.';}catch(e){document.querySelector('#stats').textContent=e.message;}});
</script></body></html>
