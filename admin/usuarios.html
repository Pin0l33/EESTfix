<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EESTfix | Usuarios</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><header class="navbar"><div class="container navbar-container"><a href="../index.html" class="logo">EEST<span>fix</span></a><nav class="nav-menu admin-nav"><a href="index.html">Panel</a><a href="reportes.html">Reportes</a><a href="usuarios.html">Usuarios</a><button class="btn btn-secondary" data-logout>Cerrar sesión</button></nav></div></header><main class="admin-shell"><h1>Gestión de usuarios</h1><div class="admin-panel" id="usersTable">Cargando usuarios…</div></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{try{await API.init();if(!API.user||API.user.rol!=='administrador'){location.href='../login.html';return;}const d=await API.request('../backend/usuarios/listar.php');document.querySelector('#usersTable').innerHTML=`<table class="admin-table"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Reportes</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${d.usuarios.map(u=>`<tr><td>${API.escape(u.nombre)} ${API.escape(u.apellido)}</td><td>${API.escape(u.email)}</td><td><select data-role="${u.id}">${['alumno','docente','administrador'].map(x=>`<option ${x===u.rol?'selected':''}>${x}</option>`).join('')}</select></td><td>${u.cantidad_reportes}</td><td>${u.activo?'Activo':'Deshabilitado'}</td><td><button class="btn btn-primary" data-user-save="${u.id}">Guardar</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-user-save]').forEach(b=>b.onclick=async()=>{try{await API.request('../backend/usuarios/actualizar.php',{method:'POST',body:{id:b.dataset.userSave,rol:document.querySelector(`[data-role="${b.dataset.userSave}"]`).value}});alert('Usuario actualizado.');}catch(e){alert(e.message);}});}catch(e){document.querySelector('#usersTable').textContent=e.message;}});
</script></body></html>
