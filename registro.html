<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EESTfix | Registro</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body><header class="navbar"><div class="container navbar-container"><a href="index.html" class="logo">EEST<span>fix</span></a><nav class="nav-menu"><a href="index.html" class="nav-link">Inicio</a><a href="login.html" class="nav-link">Iniciar sesión</a></nav></div></header><main class="container"><section class="auth-wrap"><h1>Crear cuenta</h1><p>Registrate para enviar y seguir tus reportes.</p><form id="registerForm"><div class="form-group"><label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="100" required></div><div class="form-group"><label for="apellido">Apellido</label><input id="apellido" name="apellido" maxlength="100" required></div><div class="form-group"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" maxlength="150" required></div><div class="form-group"><label for="rol">Soy</label><select id="rol" name="rol"><option value="alumno">Alumno/a</option><option value="docente">Docente</option></select></div><div class="form-group"><label for="password">Contraseña (mínimo 8 caracteres)</label><input type="password" id="password" name="password" minlength="8" required></div><div class="form-group"><label for="password_confirm">Repetir contraseña</label><input type="password" id="password_confirm" name="password_confirm" minlength="8" required></div><button class="btn btn-primary" type="submit">Crear cuenta</button><p id="formMessage" role="status"></p></form><p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
